name: Compilador de wrapper.tzst por Inyección Directa (Mali-G52)
on:
  workflow_dispatch:

jobs:
  build-mali-wrapper-extract:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas de Compresión Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd tar curl

      - name: 2. Descargar de Forma Directa los Motores de 32 y 64 bits de Over-cmd
        run: |
          # Creamos el árbol de carpetas idéntico que busca Winlator al desempaquetar
          mkdir -p /tmp/mali_wrapper/lib64
          mkdir -p /tmp/mali_wrapper/lib
          mkdir -p /tmp/mali_wrapper/etc/vulkan/icd.d

          echo "Descargando libvulkan_wrapper.so de 64 bits mediante enlace directo RAW..."
          curl -sLo /tmp/mali_wrapper/lib64/libvulkan_wrapper.so "https://github.com" || \
          curl -sLo /tmp/mali_wrapper/lib64/libvulkan_wrapper.so "https://github.com"

          echo "Descargando libvulkan_wrapper.so de 32 bits (Indispensable para juegos antiguos)..."
          curl -sLo /tmp/mali_wrapper/lib/libvulkan_wrapper.so "https://github.com" || \
          curl -sLo /tmp/mali_wrapper/lib/libvulkan_wrapper.so "https://github.com"

          # ASIGNACIÓN DE NOMBRE MAESTRO CON PUNTO EXACTO EXIGIDO: wrapper_icd.aarch64.json
          echo '{"ICD": {"api_version": "1.1.0", "library_path": "libvulkan_wrapper.so"}}' > /tmp/mali_wrapper/etc/vulkan/icd.d/wrapper_icd.aarch64.json

      - name: 3. Empaquetar Entorno Gráfico Unificado en Formato wrapper.tzst
        run: |
          cd /tmp/mali_wrapper
          # Comprimimos la raíz dual limpia usando ZSTD nivel 19 (máxima compresión compatible)
          tar -cf - . | zstd -19 > /tmp/wrapper.tzst
          cd -

      - name: 4. Subir wrapper.tzst Listo para tu Unisoc T618 a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Overcmd-Wrapper-Dual-Unisoc
          path: /tmp/wrapper.tzst
