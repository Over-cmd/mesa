name: Compilador de wrapper.tzst por Inyección Directa (Mali-G52)
on:
  workflow_dispatch:

jobs:
  build-mali-wrapper-extract:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas de Compresión y Extracción Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd tar curl unzip git

      - name: 2. Descargar Código Base del Proyecto Over-cmd/Winlator-Ludashi
        uses: actions/checkout@v4
        with:
          repository: 'Over-cmd/Winlator-Ludashi'
          ref: 'main'
          path: 'overcmd_src'
          fetch-depth: 1

      - name: 3. Estructurar Contenedor Dual 32/64 bits e Inyectar Librerías Gráficas
        run: |
          # Creamos la raíz estructural idéntica que Winlator desempaqueta en el teléfono
          mkdir -p /tmp/mali_wrapper/lib64
          mkdir -p /tmp/mali_wrapper/lib
          mkdir -p /tmp/mali_wrapper/etc/vulkan/icd.d

          # 1. Buscamos y copiamos el driver de 64 bits (arm64-v8a) del árbol de Over-cmd
          SO_64=$(find overcmd_src/app/src/main/jniLibs/arm64-v8a -name "libvulkan_wrapper.so" | head -n 1)
          if [ ! -z "$SO_64" ] && [ -f "$SO_64" ]; then
            echo "Inyectando libvulkan_wrapper.so de 64 bits..."
            cp -f "$SO_64" /tmp/mali_wrapper/lib64/libvulkan_wrapper.so
          fi

          # 2. Buscamos y copiamos el driver de 32 bits (armeabi-v7a indispensable para DX9)
          SO_32=$(find overcmd_src/app/src/main/jniLibs/armeabi-v7a -name "libvulkan_wrapper.so" | head -n 1)
          if [ ! -z "$SO_32" ] && [ -f "$SO_32" ]; then
            echo "Inyectando libvulkan_wrapper.so de 32 bits..."
            cp -f "$SO_32" /tmp/mali_wrapper/lib/libvulkan_wrapper.so
          fi

          # FIJADO DE NOMBRE DE MANIFIESTO REQUERIDO: wrapper_icd.aarch64.json con punto exacto
          echo '{"ICD": {"api_version": "1.1.0", "library_path": "libvulkan_wrapper.so"}}' > /tmp/mali_wrapper/etc/vulkan/icd.d/wrapper_icd.aarch64.json

      - name: 4. Empaquetar Entorno Gráfico Unificado en Formato wrapper.tzst
        run: |
          cd /tmp/mali_wrapper
          # Comprimimos la estructura dual limpia usando ZSTD nivel 19 (máxima compresión compatible)
          tar -cf - . | zstd -19 > /tmp/wrapper.tzst
          cd -

      - name: 5. Subir wrapper.tzst Listo para tu Unisoc T618 a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Overcmd-Wrapper-Dual-Unisoc
          path: /tmp/wrapper.tzst
