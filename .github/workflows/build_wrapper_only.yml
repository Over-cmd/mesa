name: Extractor Exclusivo de wrapper.tzst Steven-mxz Original
on:
  workflow_dispatch:

jobs:
  extraer-wrapper-steven:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas de Extracción y Compresión
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd tar curl unzip

      - name: 2. Descargar APK Oficial de Steven-mxz y Extraer wrapper.tzst
        run: |
          mkdir -p /tmp/steven_raw
          # Descargamos el APK original legítimo desde su almacenamiento oficial
          curl -sLo /tmp/steven_raw/base.apk "https://github.com" || true
          
          # Extraemos el contenedor wrapper.tzst original del autor
          cd /tmp/steven_raw
          unzip -p base.apk "assets/wrapper.tzst" > /tmp/wrapper_original.tzst || true
          cd -

      - name: 3. Desempaquetar y Cambiar Nombre del Manifiesto a wrapper_icd.aarch64.json
        run: |
          mkdir -p /tmp/mali_extract
          # Descompresión del contenedor original de Steven
          tar -I zstd -xf /tmp/wrapper_original.tzst -C /tmp/mali_extract || true
          
          # Buscamos las carpetas de configuración icd.d internas
          find /tmp/mali_extract -type d -name "icd.d" | while read -r icd_dir; do
            echo "Modificando estructura ICD en la ruta: $icd_dir"
            # Limpiamos rastros anteriores de nombres genéricos
            rm -rf "$icd_dir"/*
            
            # PARCHE MAESTRO: Escribimos el JSON con la nomenclatura de punto exacta exigida por tu sistema
            cat << 'EOF' > "$icd_dir"/wrapper_icd.aarch64.json
            {
              "ICD": {
                "api_version": "1.1.0",
                "library_path": "libvulkan_wrapper.so"
              }
            }
            EOF
          done

      - name: 4. Reempaquetar el Contenedor en Formato Puro wrapper.tzst
        run: |
          mkdir -p /tmp/artifact_output
          cd /tmp/mali_extract
          # Volvemos a comprimir la estructura original intacta con el nuevo JSON fijado (ZSTD Nivel 19)
          tar -cf - . | zstd -19 > /tmp/artifact_output/wrapper.tzst
          cd -

      - name: 5. Subir wrapper.tzst Terminado a tus Artifacts de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-tzst-Steven-Mali-Corregido
          path: /tmp/artifact_output/wrapper.tzst
