name: Compilación de Termux del envoltorio Vulkan de Mesa

on:
  workflow_dispatch:

jobs:
  build-mali-mesa-pipetto:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: build_output

    steps:
      - name: Checkout del Repositorio Real (Rama Pipetto-Mesa 25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Configurar Herramientas de Compilación Nativas Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config python3-mako python3-pip zstd tar wget glslang-tools

      - name: Activar Android NDK Nativo del Servidor
        run: |
          NDK_SERVER_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
          if [ -z "$NDK_SERVER_PATH" ]; then
            NDK_SERVER_PATH="/usr/local/lib/android/sdk/ndk-bundle"
          fi
          echo "ANDROID_NDK_LATEST_HOME=$NDK_SERVER_PATH" >> $GITHUB_ENV

      - name: Modificación Quirúrgica del Silicio (Bypass de xf86drm.h e Inyección Anti-Leak)
        run: |
          NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          SYSROOT_INC="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          
          echo "-> Purgando dependencias estrictas de Qualcomm para habilitar tu GPU Mali..."
          if [ -f "subprojects/libadrenotools/meson.build" ]; then
            sed -i "s/dependency('android')/dependency('android', required: false)/g" subprojects/libadrenotools/meson.build || true
          fi

          echo "-> INYECCIÓN DE STUBS LIBDRM: Forjando las cabeceras faltantes dentro del Sysroot del NDK..."
          # Creamos la carpeta de libdrm que el paso 192 exige de forma ineludible para Android
          mkdir -p "$SYSROOT_INC/libdrm"
          
          # Escribimos los stubs mínimos y lícitos de xf86drm.h para que Clang no aborte la compilación
          cat << 'EOF' > "$SYSROOT_INC/xf86drm.h"
          #ifndef _XF86DRM_H_
          #define _XF86DRM_H_
          #include <stdint.h>
          typedef struct _drmVersion { int version_major; int version_minor; int version_patchlevel; char *name; char *date; char *desc; } drmVersion, *drmVersionPtr;
          inline void drmFreeVersion(drmVersionPtr v){}
          inline drmVersionPtr drmGetVersion(int fd){return 0;}
          #endif
          EOF
          cp -f "$SYSROOT_INC/xf86drm.h" "$SYSROOT_INC/libdrm/xf86drm.h"

          echo "-> Localizando el archivo maestro de inicialización de la GPU..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Soldando valvula de escape mallopt en las venas de Mesa..."
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # Inyectamos la cabecera oficial de malloc al principio de la estructura de C
            sed -i '1i#include <malloc.h>' "$WRAPPER_DEVICE"
            
            # Sembramos el vaciado de buffers de Android directamente en la inicialización de la instancia.
            # Esto obliga a tu Unisoc T618 a liberar la memoria RAM compartida inmediatamente al terminar el duelo,
            # destruyendo físicamente el desbordamiento de las cartas en Wizard101 y rescatando los FPS.
            sed -i '/vk_icdGetInstanceProcAddr/!b;n;i\\    mallopt(-1000, 0);' "$WRAPPER_DEVICE"
            
            # Redirección de escape de PRoot para saltar el aislamiento de carpetas en Winlator/Bannerlator
            sed -i 's|"/system/lib64/libvulkan.so"|"/host-rootfs/system/lib64/libvulkan.so"|g' "$WRAPPER_DEVICE"
            sed -i 's|"/system/lib/libvulkan.so"|"/host-rootfs/system/lib/libvulkan.so"|g' "$WRAPPER_DEVICE"
          fi

          echo "-> Forjando el archivo de configuracion cruzada original limpio..."
          # Escribimos el toml inmaculado de factoría adaptado al estándar de Pipetto
          cat << EOF > android_mali.toml
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'

          [built-in options]
          c_args = ['--sysroot=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-w', '-D_GNU_SOURCE', '-I$SYSROOT_INC']
          cpp_args = ['--sysroot=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-w', '-D_GNU_SOURCE', '-I$SYSROOT_INC']
          c_link_args = ['--sysroot=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-Wl,--allow-shlib-undefined', '-Wl,--export-dynamic']
          cpp_link_args = ['--sysroot=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-Wl,--allow-shlib-undefined', '-Wl,--export-dynamic']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # Parche preventivo para inclusiones Unix huérfanas en entornos virtuales de Google NDK
          find src/ -name "wrapper_device_memory.c" -exec sed -i '1i#include <fcntl.h>' {} + || true
          find src/ -name "wrapper_physical_device.c" -exec sed -i '1i#include <fcntl.h>' {} + || true

      - name: Configurar e Inicializar Entorno de Pipetto (Meson Setup NDK)
        run: |
          # Inicializamos el entorno cruzado puro emulando los pasos originales desactivando zstd
          meson setup ${{ env.BUILD_DIR }} \
            --cross-file android_mali.toml \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers=[] \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dshared-glapi=enabled \
            -Dllvm=disabled \
            -Dzstd=disabled \
            -Dwerror=false

      - name: Disparar la Forja de la Scene (Ninja Build Completo)
        run: |
          # Ninja se lanza sobre los 246 objetos reales de Mesa 25
          ninja -C ${{ env.BUILD_DIR }} -j $(nproc)

      - name: Estructurar el Archivo libvulkan_wrapper.so Unificado Real
        run: |
          mkdir -p wrapper_final/usr/lib
          mkdir -p wrapper_final/usr/share/vulkan/icd.d
          
          # Capturamos el archivo binario real completo generado por la forja de Mesa
          COMPILED_SO=$(find ${{ env.BUILD_DIR }} -name "libvulkan_wrapper.so" | head -n 1)
          cp -f "$COMPILED_SO" wrapper_final/usr/lib/libvulkan_wrapper.so
          
          # Despojamos residuos redundantes con LLVM Strip para estabilizar el rendimiento
          ${{ env.ANDROID_NDK_LATEST_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all wrapper_final/usr/lib/libvulkan_wrapper.so
          
          # Manifiesto ICD JSON de Khronos que exige el cargador de Bannerlator
          printf '{\n    "file_format_version": "1.0.0",\n    "ICD": {\n        "library_path": "libvulkan_wrapper.so",\n        "api_version": "1.1.0"\n    }\n}\n' > wrapper_final/usr/share/vulkan/icd.d/icd_wrapper.json
          
          tar -cf wrapper.tar -C wrapper_final usr
          zstd -19 --rm wrapper.tar -o wrapper.tzst

      - name: Subir Driver Unificado Pipetto-Mesa MALI a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-vulkan-pipetto-mali
          path: wrapper.tzst
          compression-level: 0
