name: Mesa Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilacion

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Instalar herramientas de compresión Zstd en el servidor de GitHub
      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Surgical Silicon Modification (Anti-Overflow & Sync Balance MALI)
        run: |
          echo "-> Rastreando el corazon del Wrapper para restaurar el flujo estable MALI..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Soldando valvula de purga y sincronizacion vertical de Vulkan..."
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # Inyectamos prototipos estándar de gestión de memoria y sistema
            sed -i '1iextern int mallopt(int param, int value);' "$WRAPPER_DEVICE"
            sed -i '1iextern int setenv(const char *name, const char *value, int overwrite);' "$WRAPPER_DEVICE"
            
            # MODIFICACIÓN CORREGIDA:
            # 1. Volvemos al mallopt(-1002, 0) que te mantenía el menú y el juego estables sin saturar la RAM.
            # 2. Eliminamos los overrides de extensiones pesados que daban tirones.
            # 3. Forzamos vk_x11_strict_image_count y vk_wait_for_present para sincronizar logos y videos perfectamente.
            sed -i '/vk_icdGetInstanceProcAddr/!b;n;i\\ extern int mallopt(int p, int v);\\n extern int setenv(const char *n, const char *v, int o);\\n mallopt(-1002, 0);\\n setenv("vk_x11_strict_image_count", "true", 1);\\n setenv("vk_wait_for_present", "true", 1);' "$WRAPPER_DEVICE"
            
            echo "-> Silicio de Mesa restaurado con equilibrio de sincronizacion."
          else
            echo "-> Archivo wrapper_device.c no encontrado, aplicando inyección alternativa limpia..."
            find src/ -name "*.c" -exec sed -i 's/vk_icdGetInstanceProcAddr/extern int mallopt(int p, int v); extern int setenv(const char *n, const char *v, int o); mallopt(-1002, 0); setenv("vk_x11_strict_image_count", "true", 1); setenv("vk_wait_for_present", "true", 1); vk_icdGetInstanceProcAddr/g' {} + || true
          fi

      - name: Wrapper Compiler (Atomic Processing Docker MALI)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      # ESTE PASO CREA LA ESTRUCTURA EXACTA PARA BANNERLATOR Y GENERA EL ARCHIVO .TZST
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Moviendo el driver compilado a usr/lib..."
          cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          
          echo "-> Inyectando manifiesto JSON ICD oficial en usr/share/vulkan/icd.d..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Comprimiendo la estructura en formato atómico wrapper.tzst..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          
          echo "-> ¡Empaquetado completado con éxito!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          if-no-files-found: error
