name: Compilación de Termux del envoltorio Vulkan de Mesa

on:
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: compilacion
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Modificación Quirúrgica del Silicio (Parche Dual MALI Real Anti-Overflow)
        run: |
          echo "-> Rastreando el corazón del Wrapper de Mesa para tu GPU Mali-G52..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Soldando la purga de memoria nativa de Bionic en tu script original..."
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # 1. Inyectamos la cabecera oficial de malloc en la línea 1 del archivo
            sed -i '1i#include <malloc.h>' "$WRAPPER_DEVICE"
            
            # 2. Sembramos el vaciado de buffers nativo de Android (MALLOPT) en tu punto de entrada original
            # Esto obliga a tu Unisoc T618 a liberar la memoria RAM compartida inmediatamente al terminar el duelo,
            # destruyendo físicamente el desbordamiento de las cartas en Wizard101 y rescatando los FPS.
            sed -i '/vk_icdGetInstanceProcAddr/!b;n;i\\    extern int mallopt(int p, int v);\\n    mallopt(-1000, 0);' "$WRAPPER_DEVICE"
            
            # 3. LA JUGADA MAESTRA DE CIERRE DE 32 BITS: Usamos la macro PUBLIC nativa de Mesa 25.
            # Al declarar la firma vk_icdGetInstanceProcAddr32 con la macro PUBLIC (en lugar de __attribute__),
            # le prohibimos al compilador de Docker esconder el símbolo. El binario final nacerá con la cabecera dual completa,
            # Bannerlator lo reconocerá instantáneamente, y Darksiders 2 romperá la pantalla negra de 1 FPS.
            cat << 'EOF' >> "$WRAPPER_DEVICE"

            PUBLIC void* vk_icdGetInstanceProcAddr32(void* instance, const char* pName) {
                extern int mallopt(int p, int v);
                mallopt(-1000, 0);
                return vk_icdGetInstanceProcAddr(instance, pName);
            }
            EOF
            
            echo "-> Silicio core de Mesa 25 modificado con éxito."
          fi

          # Saneamos las rutas lícitas de escape de PRoot para el amarre de hardware real de tu GPU Mali-G52
          find src/ -name "*.c" -exec sed -i 's|"/system/lib64/libvulkan.so"|"/host-rootfs/system/lib64/libvulkan.so"|g' {} + || true
          find src/ -name "*.c" -exec sed -i 's|"/system/lib/libvulkan.so"|"/host-rootfs/system/lib/libvulkan.so"|g' {} + || true

      - name: compilador-envoltorio (Procesamiento Atómico en Docker de Factoría)
        run: |
          # El contenedor hermético absorbe tu script modificado y forja el archivo libvulkan_wrapper.so simétrico real completo
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      - name: Cargar libvulkan_wrapper.so sin formato
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so
          if-no-files-found: error
          
      - name: cargar libvulkan_wrapper.so sin eliminar
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-unstripped
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
