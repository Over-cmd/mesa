name: Compilación de Termux del envoltorio Vulkan de Mesa

on:
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: compilacion
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Modificación Quirúrgica del Silicio (Bypass de Memoria MALI Real)
        run: |
          echo "-> Rastreando el corazón del Wrapper para inyectar la válvula de escape..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Soldando la purga de memoria nativa de Bionic..."
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # 1. Inyectamos la cabecera oficial de malloc en la línea 1 del archivo
            sed -i '1i#include <malloc.h>' "$WRAPPER_DEVICE"
            
            # 2. Sembramos el vaciado de buffers de Android directamente en la inicialización de la instancia de 64 bits
            # Esto destruye la caché de las cartas viejas de Wizard101 en caliente, eliminando la caída a 5 FPS de raíz
            sed -i '/vk_icdGetInstanceProcAddr/!b;n;i\\    mallopt(-1000, 0);' "$WRAPPER_DEVICE"
            
            echo "-> Silicio de Mesa modificado con éxito."
          fi

          echo "-> Reparando la tabla ELF cruzada de 32 bits en las arterias de Meson..."
          # LA JUGADA MAESTRA DE LA SCENE: En la rama wrapper-25 de Pipetto, las opciones de linkado se configuran
          # en la directiva shared_library del Wrapper. Aplicamos sed para inyectar el alias de 32 bits de forma lícita,
          # forzando a que el único libvulkan_wrapper.so final exponga la firma vk_icdGetInstanceProcAddr32 de Khronos.
          WRAPPER_MESON="src/vulkan/wrapper/meson.build"
          if [ -f "$WRAPPER_MESON" ]; then
            sed -i 's/\r$//' "$WRAPPER_MESON"
            sed -i "s/link_args : /link_args : ['-Wl,--defsym=vk_icdGetInstanceProcAddr32=vk_icdGetInstanceProcAddr'], /g" "$WRAPPER_MESON"
          fi

          # Saneamos las rutas lícitas de escape de PRoot para el amarre de hardware de tu GPU Mali-G52
          find src/ -name "*.c" -exec sed -i 's|"/system/lib64/libvulkan.so"|"/host-rootfs/system/lib64/libvulkan.so"|g' {} + || true
          find src/ -name "*.c" -exec sed -i 's|"/system/lib/libvulkan.so"|"/host-rootfs/system/lib/libvulkan.so"|g' {} + || true

      - name: compilador-envoltorio (Procesamiento Atómico en Docker MALI)
        run: |
          # El contenedor de leegao toma el mando y devora el código modificado generando el .so unificado dual real
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      - name: Cargar libvulkan_wrapper.so sin formato
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so
          if-no-files-found: error
          
      - name: cargar libvulkan_wrapper.so sin eliminar
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-unstripped
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
