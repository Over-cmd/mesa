name: Compilación de Termux del envoltorio Vulkan de Mesa

on:
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: compilacion
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Modificación Quirúrgica del Silicio (Parche Anti-Lag Wizard101 Dual MALI)
        run: |
          echo "-> Rastreando el corazon del Wrapper de Mesa original..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Soldando valvula de escape de memoria nativa de Bionic en: $WRAPPER_DEVICE"
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # 1. Inyectamos la cabecera oficial de malloc en la linea 1 del archivo
            sed -i '1i#include <malloc.h>' "$WRAPPER_DEVICE"
            
            # 2. Sembramos el vaciado radical de buffers de Android (MALLOPT) en la entrada comun de la instancia.
            # Al estar en la funcion core vk_icdGetInstanceProcAddr, el parche interceptara y limpiara la cache de RAM
            # tanto en procesos modernos de 64 bits como en hilos clasicos de 32 bits de Wizard101 (Wow64),
            # destruyendo el lag de las cartas de premio en tu Unisoc T618 sin alterar el resto de Mesa.
            sed -i '/vk_icdGetInstanceProcAddr/!b;n;iextern int mallopt(int p, int v); mallopt(-1000, 0);' "$WRAPPER_DEVICE"
            
            echo "-> Silicio core modificado con exito para ambas arquitecturas."
          fi

          # Saneamos las rutas licitas de escape de PRoot para el amarre de hardware real de tu GPU Mali-G52
          find src/ -name "*.c" -exec sed -i 's|"/system/lib64/libvulkan.so"|"/host-rootfs/system/lib64/libvulkan.so"|g' {} + || true
          find src/ -name "*.c" -exec sed -i 's|"/system/lib/libvulkan.so"|"/host-rootfs/system/lib/libvulkan.so"|g' {} + || true

      - name: compilador-envoltorio (Procesamiento Atómico en Docker de Fábrica)
        run: |
          # El contenedor hermetico oficial del repositorio toma el mando y devora el codigo de Mesa original
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      - name: Cargar libvulkan_wrapper.so sin formato
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so
          if-no-files-found: error
          
      - name: cargar libvulkan_wrapper.so sin eliminar
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-unstripped
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
