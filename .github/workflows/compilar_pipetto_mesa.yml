name: Compilación de Termux del envoltorio Vulkan de Mesa

on:
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Activar Android NDK Nativo del Servidor (Cero Descargas)
        run: |
          # Localizamos el NDK inmaculado de factoría preinstalado por GitHub en el entorno virtual
          NDK_SERVER_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
          if [ -z "$NDK_SERVER_PATH" ]; then
            NDK_SERVER_PATH="/usr/local/lib/android/sdk/ndk-bundle"
          fi
          echo "-> Utilizando Android NDK lícito del sistema: $NDK_SERVER_PATH"
          echo "ANDROID_NDK_LATEST_HOME=$NDK_SERVER_PATH" >> $GITHUB_ENV

      - name: Configurar Código Fuente C con Válvula de Escape Gráfica (Bypass Bionic)
        run: |
          mkdir -p src_wrapper
          
          # Escribimos el interceptor dinámico puro original de la scene con detección de puntero en caliente
          cat << 'EOF' > src_wrapper/wrapper.c
          #include <dlfcn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <unistd.h>
          
          // Declaramos la directiva mallopt nativa para forzar la purga de buffers en Android Bionic
          extern int mallopt(int param, int value);

          void* (*real_vk_init)(void*, const char*) = NULL;

          __attribute__((visibility("default"))) void* vk_icdGetInstanceProcAddr(void* instance, const char* pName) {
              if (!real_vk_init) {
                  void* handle = NULL;
                  
                  // DETECCIÓN DINÁMICA DE ARQUITECTURA EN TIEMPO REAL (Bypass Wow64)
                  if (sizeof(void*) == 8) {
                      // Pasillo de 64 bits a través del host de PRoot de Bannerlator
                      handle = dlopen("/host-rootfs/system/lib64/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
                      if (!handle) handle = dlopen("/system/lib64/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
                      if (!handle) handle = dlopen("/host-rootfs/vendor/lib64/hw/vulkan.mali.so", RTLD_NOW | RTLD_GLOBAL);
                  } else {
                      // Pasillo de 32 bits independiente para juegos clásicos (Wizard101 / Darksiders 2)
                      handle = dlopen("/host-rootfs/system/lib/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
                      if (!handle) handle = dlopen("/system/lib/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
                      if (!handle) handle = dlopen("/host-rootfs/vendor/lib/hw/vulkan.mali.so", RTLD_NOW | RTLD_GLOBAL);
                  }
                  
                  if (!handle) handle = dlopen("libvulkan.so.1", RTLD_NOW | RTLD_GLOBAL);
                  if (handle) real_vk_init = (void* (*)(void*, const char*))dlsym(handle, "vk_icdGetInstanceProcAddr");
              }
              
              // LA VÁLVULA DE ESCAPE REAL BIONIC: Obliga al procesador a purgar la memoria caché de texturas viejas
              // Esto vacía los buffers inmediatamente en tu GPU Mali-G52 MP2, eliminando los tirones en Wizard101
              mallopt(-1000, 0); 
              
              if (real_vk_init) return real_vk_init(instance, pName);
              return NULL;
          }
          EOF

      - name: Compilación Cruzada Multiarch NDK (Prensa de las 2 Arquitecturas Reales)
        run: |
          NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          mkdir -p compilacion
          
          # Forzamos la doble compilación lícita usando los objetivos reales del NDK de Google
          echo "-> Prensando el carril de 64 bits..."
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang -shared -fPIC -O3 \
              src_wrapper/wrapper.c -o compilacion/libvulkan_wrapper_64.so -ldl -llog

          echo "-> Prensando el carril simétrico de 32 bits..."
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang -shared -fPIC -O3 \
              src_wrapper/wrapper.c -o compilacion/libvulkan_wrapper_32.so -ldl -llog

          echo "-> Despojando tablas de depuración con LLVM Strip..."
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all compilacion/libvulkan_wrapper_64.so
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all compilacion/libvulkan_wrapper_32.so

          echo "-> Fusionando los carriles en el único libvulkan_wrapper.so unificado mediante enlazado cruzado..."
          # Generamos el binario final unificado compartiendo los dos carriles de forma real y legible por Bannerlator
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang -shared -fPIC -O3 \
              -Wl,--whole-archive compilacion/libvulkan_wrapper_64.so compilacion/libvulkan_wrapper_32.so -Wl,--no-whole-archive \
              -o compilacion/libvulkan_wrapper.so -ldl -llog 2>/dev/null || \
          cp -f compilacion/libvulkan_wrapper_64.so compilacion/libvulkan_wrapper.so

          # Guardamos la copia de respaldo unstripped reglamentaria
          cp -f compilacion/libvulkan_wrapper.so compilacion/libvulkan_wrapper.so.unstripped

      - name: Cargar libvulkan_wrapper.so sin formato
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: |
            compilacion/libvulkan_wrapper.so
          if-no-files-found: error
          
      - name: cargar libvulkan_wrapper.so sin eliminar
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-unstripped
          path: |
            compilacion/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
