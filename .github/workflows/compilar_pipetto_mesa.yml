
nombre : Compilación de Termux del envoltorio Vulkan de Mesa

en : [push, pull_request]

empleos :
  build-aarch64-wrapper :
    se ejecuta en : ubuntu-latest

    entorno :
      BUILD_DIR : compilación
      ETIQUETA DE IMAGEN : ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    pasos :
      - nombre : Código de pago
        usos : actions/checkout@v4

      - nombre : Configurar Docker Buildx
        Usos : docker/setup-buildx-action@v3

      - nombre : compilador-envoltorio
        correr : |
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}
      - nombre : Cargar libvulkan_wrapper.so sin formato
        usos : actions/upload-artifact@v4
        con :
          nombre : libvulkan_wrapper
          ruta : |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so
          if-no-files-found : error
          
      - nombre : cargar libvulkan_wrapper.so sin eliminar
        usos : actions/upload-artifact@v4
        con :
          nombre : libvulkan_wrapper-unstripped
          ruta : |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so.unstripped
          if-no-files-found : error
